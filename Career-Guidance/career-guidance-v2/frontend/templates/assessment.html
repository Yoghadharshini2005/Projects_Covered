<!DOCTYPE html>
<html>
<head>
    <title>Assessment System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h1>🧠 Skill Assessment</h1>
    <div class="mb-3">
        <label>Skill (optional)</label>
        <input type="text" class="form-control" id="skill" placeholder="Python">
        <button id="loadQuiz" class="btn btn-secondary mt-2">Load Questions</button>
    </div>
    <form id="quizForm">
        <div id="questions"></div>
        <button type="submit" class="btn btn-primary mt-3" id="submitBtn" style="display:none">Submit Quiz</button>
    </form>
    <div id="results" class="mt-4" style="display:none"></div>
    <script>
        let quizData = [];
        document.getElementById('loadQuiz').onclick = async () => {
            const skill = document.getElementById('skill').value;
            const res = await fetch(`/api/assessment?skill=${skill}&count=10`);
            quizData = await res.json();
            let html = '';
            quizData.questions.forEach((q, i) => {
                html += `<div class="mb-4">
                    <h6>Q${i+1}: ${q[0]}</h6>
                    <div>`;
                for (let j=1; j<q.length-1; j++) {
                    html += `<div class="form-check">
                        <input class="form-check-input" type="radio" name="q${i}" value="${q[j]}" id="q${i}_${j}">
                        <label class="form-check-label">${q[j]}</label>
                    </div>`;
                }
                html += '</div></div>';
            });
            document.getElementById('questions').innerHTML = html;
            document.getElementById('submitBtn').style.display = 'block';
        };
        document.getElementById('quizForm').onsubmit = async (e) => {
            e.preventDefault();
            const answers = [];
            quizData.questions.forEach((_, i) => {
                const sel = document.querySelector(`input[name="q${i}"]:checked`);
                if (sel) answers.push({question_id: i+1, selected: sel.value});
            });
            const res = await fetch('/api/submit-assessment', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({answers})
            });
            const data = await res.json();
            document.getElementById('results').innerHTML = `
                <div class="card">
                    <div class="card-body">
                        <h4>Score: ${data.score}/${data.total} (${data.percentage}%)</h4>
                        ${data.feedback.length ? '<h6>Feedback:</h6><ul>' + data.feedback.map(f => `<li>${f}</li>`).join('') + '</ul>' : ''}
                    </div>
                </div>`;
            document.getElementById('results').style.display = 'block';
        };
    </script>
</body>
</html>
