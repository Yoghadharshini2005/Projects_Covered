<!DOCTYPE html>
<html>
<head>
    <title>Resume Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h1>📄 Resume Analyzer</h1>
    <form id="resumeForm">
        <div class="mb-3">
            <label>Upload PDF Resume</label>
            <input type="file" class="form-control" id="resumeFile" accept=".pdf">
        </div>
        <button type="submit" class="btn btn-primary">Analyze</button>
    </form>
    <div id="results" class="mt-4"></div>
    <script>
        document.getElementById('resumeForm').onsubmit = async (e) => {
            e.preventDefault();
            const file = document.getElementById('resumeFile').files[0];
            if (!file) return alert('Select PDF');
            const formData = new FormData();
            formData.append('resume', file);
            try {
                const res = await fetch('/api/resume', {method: 'POST', body: formData});
                const data = await res.json();
                document.getElementById('results').innerHTML = `
                    <div class="card">
                        <div class="card-body">
                            <h5>Skills Found: ${data.analysis.found_skills.join(', ')}</h5>
                            <p>Score: ${data.analysis.resume_score}/100</p>
                            <h6>Career Suggestions:</h6>
                            <ul>${data.analysis.career_suggestions.map(s => `<li>${s.career} (${s.match}%)</li>`).join('')}</ul>
                        </div>
                    </div>`;
            } catch(e) {alert('Error: ' + e)}
        }
    </script>
</body>
</html>
