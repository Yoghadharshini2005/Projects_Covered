<!DOCTYPE html>
<html>
<head>
    <title>Course Recommendation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h1>📚 Course Recommendation</h1>
    <form id="courseForm">
        <div class="mb-3">
            <label>Career</label>
            <input type="text" class="form-control" id="career" placeholder="Data Science">
        </div>
        <div class="mb-3">
            <label>Your Skills (comma sep)</label>
            <input type="text" class="form-control" id="skills" placeholder="Python, Excel">
        </div>
        <button type="submit" class="btn btn-primary">Recommend Courses</button>
    </form>
    <div id="results" class="mt-4"></div>
    <script>
        document.getElementById('courseForm').onsubmit = async (e) => {
            e.preventDefault();
            const career = document.getElementById('career').value;
            const skills = document.getElementById('skills').value;
            const res = await fetch(`/api/recommend-courses?career=${career}&user_skills=${skills}`);
            const data = await res.json();
            let html = '<h5>Missing Skills: ' + data.missing_skills.join(', ') + '</h5>';
            html += '<ul class="list-group">';
            data.recommendations.forEach(r => {
                html += `<li class="list-group-item">${r.course} (${r.stream}) - Match: ${r.score}%</li>`;
            });
            html += '</ul>';
            document.getElementById('results').innerHTML = html;
        }
    </script>
</body>
</html>
